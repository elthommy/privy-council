name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating v10 tag
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff format
        run: uv run --locked ruff format --check --diff .
      # The "F" rules in pyproject.toml are pyflakes.
      - name: ruff check
        run: uv run --locked ruff check --output-format=github .

  # A backstop: push protection blocks known tokens before they land, and a local
  # pre-commit hook runs gitleaks too. This also covers pull requests from others.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, not just the last commit
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
      - name: gitleaks
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest supported (requires-python); 3.13: the one used day to day.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # Live tests (real claude/ollama calls) are deselected by default in pyproject.toml.
      - run: uv run --locked pytest
