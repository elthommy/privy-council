name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating v10 tag
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff format
        run: uv run --locked ruff format --check --diff .
      # The "F" rules in pyproject.toml are pyflakes.
      - name: ruff check
        run: uv run --locked ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest supported (requires-python); 3.13: the one used day to day.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # Live tests (real claude/ollama calls) are deselected by default in pyproject.toml.
      - run: uv run --locked pytest
