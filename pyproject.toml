[project]
name = "privy-council"
version = "0.1.0"
description = "A private council of AI personas that debates your questions, on local models, your Claude subscription, or both."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "discord-py>=2.4,<3",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
council = "privy_council.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privy_council"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real claude/ollama calls (uses quota; opt-in with -m live)"]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
